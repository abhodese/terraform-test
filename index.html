<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhishek Sundaresan | Technical Lead</title>
    <meta name="description" content="Technical Lead portfolio and resume website." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <section class="block">
          <h2>Contacts</h2>
          <ul class="plain" id="contacts"></ul>
        </section>

        <section class="block">
          <h2>Skills</h2>
          <ul class="chips" id="skills"></ul>
        </section>

        <section class="block">
          <h2>Key Achievements</h2>
          <ul class="plain" id="achievements"></ul>
        </section>

        <section class="block">
          <h2>Certifications</h2>
          <ul class="plain" id="certifications"></ul>
        </section>
      </aside>

      <section class="content">
        <header class="hero">
          <h1 id="name"></h1>
          <p id="role" class="role"></p>
        </header>

        <section class="block">
          <h2>Summary</h2>
          <p id="summary"></p>
        </section>

        <section class="grid-two">
          <section class="block">
            <h2>Projects</h2>
            <div id="projects"></div>
          </section>

          <section class="block">
            <h2>Experience</h2>
            <div id="experience"></div>
          </section>
        </section>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
